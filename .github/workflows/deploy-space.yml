name: Deploy to Hugging Face Space

# Runs after CI passes on main. Needs two settings on the GitHub repo:
#   Variables > HF_SPACE  e.g. youssefabotaleb20/cedar-clinic
#   Secrets   > HF_TOKEN  a Hugging Face access token with write access
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Build the Space repository
        run: |
          mkdir space
          git archive HEAD | tar -x -C space
          # Spaces reject binary files pushed without LFS; the screenshots aren't needed there.
          rm -rf space/docs/screenshots space/.github
          {
            echo "---"
            echo "title: Cedar Clinic"
            echo "emoji: 🩺"
            echo "colorFrom: green"
            echo "colorTo: blue"
            echo "sdk: docker"
            echo "app_port: 8000"
            echo "pinned: false"
            echo "short_description: Clinic booking demo built with Django and MySQL"
            echo "---"
            echo
            cat README.md
          } > space/README.md
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
