# Local stack: Django + MySQL + Mailpit (catches every email, UI on :8025)
# + a reminders worker that runs the send_reminders command every 10 minutes.
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
    EMAIL_HOST: mailpit
    EMAIL_PORT: "1025"
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_demo"
    restart: "no"

  web:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  reminders:
    <<: *app
    command: sh -c "while true; do python manage.py send_reminders; sleep 600; done"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

volumes:
  mysql-data:
