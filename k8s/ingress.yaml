# Needs an ingress controller (the README installs ingress-nginx on kind).
# clinic.localtest.me resolves to 127.0.0.1, so no /etc/hosts edit is needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  ingressClassName: nginx
  rules:
    - host: clinic.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {name: http}
