apiVersion: batch/v1
kind: CronJob
metadata:
  name: send-reminders
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: send-reminders
              image: clinic-booking
              imagePullPolicy: IfNotPresent
              command: ["python", "manage.py", "send_reminders"]
              envFrom:
                - configMapRef: {name: clinic-config}
                - secretRef: {name: clinic-secrets}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 256Mi}
